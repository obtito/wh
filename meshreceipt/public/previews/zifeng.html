<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>紫峰大厦 · 大画幅建筑检视</title>
  <script type="importmap">{"imports":{"three":"/api/source/nanjing/vendor/three.module.js","three/addons/controls/OrbitControls.js":"/api/source/nanjing/vendor/OrbitControls.js"}}</script>
  <style>
    :root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#263943}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e4ebef}canvas{display:block;width:100%;height:100%;touch-action:none}
    .caption{position:fixed;left:28px;top:24px;z-index:1;pointer-events:none}.eyebrow{margin:0 0 9px;font-size:10px;letter-spacing:.2em;opacity:.55}h1{margin:0;font:500 28px "Songti SC",serif;letter-spacing:.08em}.height{margin:10px 0;font-size:15px}.height span{margin-left:8px;font-size:10px;opacity:.6}.note{margin:0;font-size:10px;line-height:1.8;opacity:.65}.hint{position:fixed;right:24px;top:26px;margin:0;font-size:10px;opacity:.55;pointer-events:none}
    .toolbar{position:fixed;z-index:2;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:max-content;max-width:calc(100% - 24px);padding:8px;border:1px solid #ffffffa0;border-radius:12px;background:#f7fafbe8;box-shadow:0 8px 28px #24405012;backdrop-filter:blur(14px)}.group{display:flex;flex-wrap:wrap;justify-content:center;max-width:100%;gap:3px}.group+.group{padding-left:6px;border-left:1px solid #c4d0d8}
    button,.large-view{border:0;border-radius:7px;padding:8px 11px;background:transparent;color:inherit;font:12px "PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}button:hover,.large-view:hover{background:#dce7ec}button[aria-pressed=true]{background:#344e5d;color:#fff}button:focus-visible,a:focus-visible{outline:2px solid #338bad;outline-offset:2px}
    body.night{color:#dce8f1}body.night .toolbar{background:#14263ce8;border-color:#c8e5ff25}body.night .group+.group{border-color:#ffffff25}body.night button:hover,body.night a:hover{background:#2e465c}body.night button[aria-pressed=true]{background:#b6d2e1;color:#142738}
    #error{position:fixed;z-index:3;left:24px;right:24px;top:160px;padding:16px;background:#fff0e6;color:#9b5035;font-size:12px;line-height:1.8}#error:empty{display:none}
    button:disabled{opacity:.45;cursor:wait}#loading{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:12px;background:#f7fafbe8;color:#344e5d;font-size:12px}
    #poster-stage{display:none}.cover-mode body{display:flex;align-items:center;justify-content:center;background:#e1e6de}.cover-mode #poster-stage{display:block;position:relative;width:min(960px,100vw,calc(100dvh * 1.42));aspect-ratio:1.42}.cover-mode .caption,.cover-mode .hint,.cover-mode .toolbar{display:none}
    @media(max-width:650px){.caption{left:16px;top:14px}.eyebrow{font-size:8px;margin-bottom:5px}h1{font-size:20px}.height{margin:6px 0;font-size:12px}.height span{font-size:9px}.note,.hint{display:none}.toolbar{bottom:12px;padding:6px;gap:4px}.group+.group{padding-left:0;border-left:0}button,.large-view{padding:7px 8px;font-size:10px}}
  </style>
</head>
<body>
  <div id="loading" role="status">正在加载三维模型…</div>
  <div id="poster-stage" aria-label="紫峰大厦封面渲染画幅"></div>
  <header class="caption"><p class="eyebrow">NANJING · ZIFENG TOWER</p><h1>紫峰大厦</h1><p class="height">450 m <span>建筑总高 · 等比展示</span></p><p class="note">GTA-NJ 程序化原模型<br>局部尺度为估算 · 展示不等于验收</p></header>
  <p class="hint">拖动旋转 · 滚轮缩放 · 右键平移</p>
  <nav class="toolbar" aria-label="建筑预览控制">
    <div class="group" aria-label="光照"><button type="button" data-mode="day" aria-pressed="true">白天</button><button type="button" data-mode="night" aria-pressed="false">夜景</button></div>
    <div class="group" aria-label="观察方向"><button type="button" data-angle="-1.5707963267948966" aria-pressed="false">北面</button><button type="button" data-angle="0" aria-pressed="false">东面</button><button type="button" data-angle="1.5707963267948966" aria-pressed="false">南面</button><button type="button" data-angle="3.141592653589793" aria-pressed="false">西面</button></div>
    <div class="group" aria-label="镜头"><button type="button" id="rotate" aria-pressed="false">自动旋转</button><button type="button" id="facade-detail">幕墙特写</button><button type="button" id="fit">封面视角</button><a class="large-view" href="./zifeng.html" target="_blank" rel="noopener">独立大屏 ↗</a></div>
  </nav>
  <div id="error" role="alert"></div>
  <script type="module">
    document.querySelectorAll('.toolbar button').forEach(button => { button.disabled = true; });
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    import('./zifeng.js').catch(error => {
      if (window.parent !== window) window.parent.postMessage({ type: 'meshreceipt-preview-status', status: 'error', message: error.message }, location.origin);
      document.getElementById('loading')?.remove();
      document.getElementById('error').textContent = `原模型预览未能加载：${error.message}。请检查 GTA-NJ 源码与运行依赖；加载失败不代表验收通过。`;
    });
  </script>
</body>
</html>
