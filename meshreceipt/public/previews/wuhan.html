<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>武汉地标 · 模型检视</title>
  <script type="importmap">{"imports":{"three":"/api/source/wuhan/vendor/three.module.js","three/addons/":"/api/source/wuhan/vendor/"}}</script>
  <link rel="stylesheet" href="./wuhan.css">
</head>
<body>
  <main id="viewport" aria-label="武汉地标三维模型"></main>
  <aside>
    <span class="eyebrow">WUHAN / LANDMARKS</span><h1 id="title">武汉地标建筑</h1>
    <p id="summary">载入已选择的建筑版本，来源与展示园景分别说明。</p>
    <span id="version-heading" class="section-label" hidden>模型版本 · 点选对比</span>
    <nav id="parts" aria-label="选择建筑"></nav>
    <button id="retry" hidden>重试当前版本</button>
    <div id="source"></div><div id="error" role="alert"></div>
    <footer>建筑素材：GTA-WH 及其引用作者<br>园景：琢信展示设计，非实地复原<br><a id="attribution" href="/api/source/wuhan/docs/ATTRIBUTION.md" target="_blank" rel="noopener">完整素材署名 ↗</a></footer>
  </aside>
  <div id="view-name">正在载入模型…</div>
  <div id="controls" aria-label="观察角度"><button id="reset" aria-pressed="true">封面视角</button><button id="front" aria-pressed="false">正视</button><button id="top" aria-pressed="false">俯视</button><button id="rotate" aria-pressed="false">环绕</button></div>
  <div id="status" role="status" aria-live="polite">尚未验收</div>
  <script type="module">
    document.querySelectorAll('#controls button').forEach(button => { button.disabled = true; });
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    import('./wuhan.js').catch(error => {
      if (window.parent !== window) window.parent.postMessage({ type: 'meshreceipt-preview-status', status: 'error', message: error.message }, location.origin);
      document.getElementById('error').textContent = `预览依赖加载失败：${error.message}`;
      document.getElementById('view-name').textContent = '预览未能加载';
      document.getElementById('status').textContent = '加载失败不能计为验收通过';
    });
  </script>
</body>
</html>
